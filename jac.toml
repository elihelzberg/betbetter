[project]
name = "betBetter"
version = "0.1.0"
description = "Michigan scratch-off research with transparent math and official Michigan data"
entry-point = "main"
kind = "web-app"
jac-version = "~=0.37.23"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
[client]

[client.app_meta_data]
title = "betBetter · Michigan scratch-off research"
description = "Explore Michigan scratch-off games with transparent expected values, prize pools, and snapshot history."
theme_color = "#245b45"
icon = "/static/assets/favicon.svg"

[test]
directory = "tests"

[serve]
host = "0.0.0.0"
port = 8000

[placement.pins]
models = "server"
endpoints = "server"
"components.Formatting" = "client"

[byllm]
[byllm.model]
default_model = "openrouter/openrouter/free"

# Never silently move the shared mobile/desktop entry point to another port.
[client.vite.server]
strictPort = true

[scripts]
dev = "python3 dev.py"
